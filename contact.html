<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="./assets/css/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

     <div class="h-16 header p-2 sticky top-0">

        <div class="n-full mx-auto container">
            <div class="flex gap-12 items-center justify-between">
                <div class="flex items-center gap-[14.5px]  max-md:hidden">
                    <img src="./assets/image/car.svg" />
                    <h3 class="text-sm font-open font-bold">Car Rental</h3>

                </div>
                <div>
                    <ul class="flex gap-5 font-semibold max-md:hidden">
                        <li class="hover:text-[#FF9E0C]">Home</li>
                        <li class="font-bold hover:text-[#FF9E0C]"><a href="./Vehicles.html">Vehicles</a> <br></li>
                        <li class="hover:text-[#FF9E0C]"><a href="./details.html">Details</a> <br></li>
                        <li class="hover:text-[#FF9E0C]"><a href="./about.html">About</a></li>
                        <li class="hover:text-[#FF9E0C]">Contact Us</li>
                    </ul>
                </div>
                <button class="md:hidden size-12">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="flex items-center gap-3">
                    <img src="./assets/image/needhelp.svg" />
                    <div class="flex-column">
                        <h3>Need help?</h3>
                        <h3 class="font-bold"> +996 247-1680</h3>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <main>

        <section class="contact py-8 pt-6">

            <div class="container n-full mx-auto">

                 <div class="head text-center">
                    <h1 class="font-bold text-4xl">Contact Us</h1>
                    <h4 class="text-gray-300 pt-2 pb-10">Home <span class="text-black">/ Contact Us</span></h4>
                </div>

                <div class="content flex items-center justify-center gap-8">

                    <div class="left-side w-75">

                        <div class="rounded-2xl bg-[#5937E0] p-6">
                        <h3 class="text-center pb-2 font-bold">Book your car</h3>
                        <div class="inputs flex flex-col h-70">
                            <input type="text" placeholder="Car Type" class="input pb-2 p-0.5" />
                            <input type="text" placeholder="Place of rental" class="input pb-2 p-0.5 pt-4" />
                            <input type="text" placeholder="Place of return" class="input pb-2 p-0.5 pt-4" />
                            <input type="date" placeholder="Rental date" class="input pb-2 p-0.5 pt-4" />
                            <input type="date" placeholder="Return date" class="input pb-10 p-0.5 pt-4" />
                            <button class="rounded-2xl px-4 py-0.5 text-white bg-[#FF9E0C]">Book Now</button>
                        </div>
                    </div>


                    </div>
                     <div class="right-side">
                        <img class="w-150 rounded-3xl" src="./assets/image/contact/mercedes.jpg"/>
                    </div>

                </div>

                <div class="first flex justify-between pt-10">

                <div class="content flex items-center gap-2">
                    <img src="./assets/image/footer/location.svg" />
                    <div class="details flex flex-col">
                        <h4>Address</h4>

                        <span class="font-medium">Oxford Ave. Cary, NC 27511</span>
                    </div>
                </div>
                <div class="content flex items-center gap-2">
                    <img src="./assets/image/footer/messege.svg" />
                    <div class="details flex flex-col">
                        <h4>Email </h4>

                        <span class="font-medium">nwiger@yahoo.com</span>
                    </div>
                </div>
                <div class="content flex items-center gap-2">
                    <img src="./assets/image/footer/call.svg" />
                    <div class="details flex flex-col">
                        <h4>Phone </h4>

                        <span class="font-medium">+537 547-6401</span>
                    </div>
                </div>

                <div class="content flex items-center gap-2">
                    <img class="h-10 w-10" src="./assets/image/contact/Icon.svg" />
                    <div class="details flex flex-col">
                        <h4>Opening hours</h4>

                        <span class="font-medium">Sun-Mon: 10am - 10pm</span>
                    </div>
                </div>


            </div>


            </div>

        </section>


    </main>
    
</body>
</html>
